name: Windows build
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
      - name: Tests
        run: python -m unittest discover -s tests -v
      - name: Qt smoke
        shell: pwsh
        run: |
          $env:QT_QPA_PLATFORM='offscreen'
          python -c "from PySide6.QtWidgets import QApplication; from main import Office; a=QApplication([]); w=Office(); w.close()"
      - name: Build portable app
        run: pyinstaller --noconfirm --clean --windowed --name GameDevAIOffice main.py
      - uses: actions/upload-artifact@v4
        with:
          name: GameDevAIOffice-Windows
          path: dist/GameDevAIOffice/
