name: Windows portable and installer
on:
  push:
    branches: [feature/gamedev-ai-office]
  workflow_dispatch:
jobs:
  windows-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller
      - name: Package executable and Unity Bridge
        run: pyinstaller --noconfirm --clean --windowed --name GameDevAIOffice --add-data "unity_bridge;unity_bridge" main.py
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Make Windows setup
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss
      - uses: actions/upload-artifact@v4
        with:
          name: GameDevAIOffice-Windows-Portable
          path: dist/GameDevAIOffice/
      - uses: actions/upload-artifact@v4
        with:
          name: GameDevAIOffice-Windows-Setup
          path: dist/GameDevAIOffice-Setup.exe
