name: GameDev AI Office checks

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  python-tests:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Compile Python source
        run: python -m compileall -q .
      - name: GDD integrity check
        run: python cargo_project.py --unity-project . --check
      - name: Python unit tests
        run: python -m unittest discover -s tests -v
      - name: Qt offscreen smoke
        run: python -c "import main; from PySide6.QtWidgets import QApplication; app=QApplication([]); print('Qt app created')"
